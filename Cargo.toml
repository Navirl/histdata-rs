[package]
name = "histdata"
version = "0.1.0"
edition = "2024"
description = "Download FX historical data from HistData.com (Rust port of the Python histdata package)"
license = "Apache-2.0"
rust-version = "1.88"
readme = "README.md"
repository = "https://github.com/Navirl/histdata-rs"
keywords = ["forex", "fx", "histdata", "finance", "trading"]
categories = ["finance", "api-bindings"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "form", "http2", "rustls", "stream"] }
scraper = "0.29.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = "0.3.23"
wiremock = "0.6.5"
